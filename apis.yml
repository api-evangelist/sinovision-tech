description: Sinovision (Sinovision Weisheng, 赛诺威盛) is a Beijing-based medical imaging technology
  company that designs and manufactures computed tomography (CT) systems and related clinical solutions.
  Its portfolio spans the Insitum 16-128-slice scanners, the Alpha series up to 512 slices, veterinary
  Petcare CT, mobile and vehicle-mounted units, image-guided navigation robotics, AI-assisted diagnostics,
  and the Sinoplatform cloud imaging platform, with 700+ installations across 150+ international partners.
  It is tracked in the API Evangelist network as a portfolio company of Qiming Venture Partners; as of this
  enrichment pass the public website publishes no developer API, SDK, or documentation surface.
